<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <img class="header__infographic" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix infographic">
      <a class="header__info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section>
        <label class="new-task" for="new-task">Add Item</label>
        <div class="task-wrapper">
          <input class="input task input__text new-task__input" type="text">
          <button class="btn">Add</button>
        </div>
      </section>
      <h3 class="title">Todo</h3>
      <section class="editor editor__incomplete-tasks">
        <li class="editor__component">
          <input class="input editor__checkbox" type="checkbox">
          <label class="task editor__label">Pay Bills</label>
          <input class="input task input__text" type="text">
          <button class="btn editor__btn-edit">Edit</button>
          <button class="btn editor__btn-delete">
            <img class="editor__btn-delete__img" src="./remove.svg" alt="delete button">
          </button>
        </li>
        <li class="editor__component edit-mode">
          <input class="input editor__checkbox" type="checkbox">
          <label class="task editor__label">Go Shopping</label>
          <input class="input task input__text" type="text" value="Go Shopping">
          <button class="btn editor__btn-edit">Save</button>
          <button class="btn editor__btn-delete">
            <img class="editor__btn-delete__img" src="./remove.svg" alt="delete button">
          </button>
        </li>
      </section>
      <h3 class="title">Completed</h3>
      <section class="editor editor__completed-tasks">
        <li class="editor__component">
          <input class="input editor__checkbox" type="checkbox" checked>
          <label class="task editor__label">See the Doctor</label>
          <input class="input task input__text" type="text">
          <button class="btn editor__btn-edit">Edit</button>
          <button class="btn editor__btn-delete">
            <img class="editor__btn-delete__img" src="./remove.svg" alt="delete button">
          </button>
        </li>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
