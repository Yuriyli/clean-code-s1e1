<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <div class="header">
      <img class="header-infographic" src="./eisenhower-matrix.jpg">
      <a class="info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main">
      <p id="add-tasks">
        <label class="new-task" for="new-task">Add Item</label>
        <div class="task-wrapper">
          <input id="new-task"class="input input-text task" type="text">
          <button class="btn">Add</button>
        </div>
      </p>
      <h3 class="title">Todo</h3>
      <ul id="incomplete-tasks" class="editor">
        <li class="editor-component">
          <input class="input editor-checkbox" type="checkbox">
          <label class="task editor-label">Pay Bills</label>
          <input class="input input-text task" type="text">
          <button class="btn edit">Edit</button>
          <button class="btn delete">
            <img class="btn-delete-img" src="./remove.svg">
          </button>
        </li>
        <li class="editor-component edit-mode">
          <input class="input editor-checkbox" type="checkbox">
          <label class="editor-label task">Go Shopping</label>
          <input class="input input-text task" type="text" value="Go Shopping">
          <button class="btn edit">Save</button>
          <button class="btn delete">
            <img class="btn-delete-img" src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="title">Completed</h3>
      <ul id="completed-tasks" class="editor">
        <li class="editor-component">
          <input class="input editor-checkbox" type="checkbox" checked>
          <label class="task editor-label">See the Doctor</label>
          <input class="input input-text task" type="text">
          <button class="btn edit">Edit</button>
          <button class="btn delete">
            <img class="btn-delete-img" src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
